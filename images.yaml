# Image Factory Exemplar - Image Registry
# Simple example using a local nginx image

- name: hello-world
  registry: ghcr.io
  repository: craigedmunds/hello-world
  source:
    # For local development, this points to a local Dockerfile
    # In production, this would be a real GitHub repo
    dockerfile: example-images/hello-world/Dockerfile
  rebuildDelay: 1d
  autoRebuild: true
